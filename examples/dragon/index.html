<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sprite-stack-kit · ドラゴン</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e60aa;
      }
      canvas {
        display: block;
        /* hard pixels: the low-resolution picture is scaled up without smoothing */
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        touch-action: none;
        cursor: crosshair;
      }
      #hint,
      #view,
      #invert {
        position: fixed;
        font: 12px/1.3 ui-monospace, 'SF Mono', Menlo, Consolas, 'Hiragino Sans', 'Noto Sans JP', monospace;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(16, 22, 38, 0.62);
        border-radius: 4px;
      }
      #hint {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: fit-content;
        margin: 0 auto;
        padding: 7px 11px;
        text-align: center;
        pointer-events: none;
      }
      /* in the cockpit the bottom of the screen is the dashboard, so the hint moves up */
      #hint.high {
        top: 12px;
        bottom: auto;
        left: 76px;
        right: 76px;
      }
      #view,
      #invert {
        top: 12px;
        right: 12px;
        padding: 8px 12px;
        border: 0;
        cursor: pointer;
      }
      /* the up/down switch sits under the view button */
      #invert {
        top: 50px;
      }
      #invert[aria-pressed='true'] {
        color: rgb(255, 214, 120);
        background: rgba(120, 40, 20, 0.78);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="view" type="button">視点</button>
    <button id="invert" type="button" aria-pressed="false">上下反転：オフ</button>
    <div id="hint"></div>
    <!-- Opened straight from disk, a browser refuses to load the game's modules and the page stays blank. -->
    <script>
      function needsServer() {
        document.getElementById('hint').textContent = 'このページはローカルサーバーが必要です · キットのフォルダで「bun start --game examples/dragon」を実行し、表示されたアドレスを開いてください'
      }
    </script>
    <script type="module" src="./src/main.js" onerror="needsServer()"></script>
  </body>
</html>

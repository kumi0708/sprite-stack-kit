<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Worldfight · sprite-stack-kit</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e60aa;
      }
      canvas {
        display: block;
        /* hard pixels: the low-resolution picture is scaled up without smoothing */
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        touch-action: none;
        cursor: crosshair;
      }
      #hint,
      button {
        position: fixed;
        font: 11px/1.2 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(16, 22, 38, 0.62);
        border-radius: 4px;
      }
      #hint {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: fit-content;
        margin: 0 auto;
        padding: 7px 11px;
        text-align: center;
        pointer-events: none;
      }
      button {
        right: 12px;
        width: 58px;
        padding: 8px 0;
        border: 0;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #view {
        top: 12px;
      }
      #down {
        top: 48px;
      }
      #up {
        top: 84px;
      }
      /* over the city there is no way further down, so the missile button takes DOWN's place */
      #missile {
        top: 48px;
      }
      #boost {
        top: 120px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* the up/down switch sits at the bottom of the column; it stands out while it is on */
      #invert {
        top: 156px;
        white-space: pre;
      }
      #invert[aria-pressed='true'] {
        color: rgb(255, 214, 120);
        background: rgba(120, 40, 20, 0.78);
      }
      button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="view" type="button">VIEW</button>
    <button id="down" type="button">DOWN</button>
    <button id="up" type="button">UP</button>
    <button id="missile" type="button" hidden>MSL</button>
    <button id="boost" type="button" hidden>BOOST</button>
    <button id="invert" type="button" aria-pressed="false">INVERT
OFF</button>
    <div id="hint"></div>
    <!-- Opened straight from disk, a browser refuses to load the game's modules and the page stays blank. -->
    <script>
      function needsServer() {
        document.getElementById('hint').textContent = 'THIS PAGE NEEDS A LOCAL SERVER · IN THE KIT FOLDER RUN "bun scripts/serve.mjs examples/worldfight" AND OPEN THE ADDRESS IT PRINTS'
      }
    </script>
    <script type="module" src="./src/main.js" onerror="needsServer()"></script>
  </body>
</html>
